<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="订单系统主从复制与读写分离案例">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 24px 'Microsoft YaHei',Arial;fill:#172033}
      .txt{font:700 15px 'Microsoft YaHei',Arial;fill:#172033;text-anchor:middle}
      .small{font:600 12px 'Microsoft YaHei',Arial;fill:#64748b;text-anchor:middle}
      .note{font:600 13px 'Microsoft YaHei',Arial;fill:#475569}
      .node{filter:url(#shadow);stroke-width:2}
      .line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1240" height="600" rx="18" fill="#f8fafc"/>
  <text x="34" y="46" class="title">真实案例：电商订单系统的主从复制与读写分离</text>

  <rect x="60" y="120" width="145" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" class="node"/>
  <text x="132" y="147" class="txt">下单 / 支付</text>
  <text x="132" y="168" class="small">写请求</text>

  <rect x="270" y="120" width="160" height="66" rx="12" fill="#fee2e2" stroke="#dc2626" class="node"/>
  <text x="350" y="147" class="txt">主库 Order DB</text>
  <text x="350" y="168" class="small">写入 + Binlog</text>

  <rect x="520" y="70" width="145" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" class="node"/>
  <text x="592" y="97" class="txt">从库 A</text>
  <text x="592" y="118" class="small">订单列表读</text>

  <rect x="520" y="190" width="145" height="66" rx="12" fill="#dcfce7" stroke="#16a34a" class="node"/>
  <text x="592" y="217" class="txt">从库 B</text>
  <text x="592" y="238" class="small">物流 / 售后读</text>

  <rect x="820" y="120" width="150" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" class="node"/>
  <text x="895" y="147" class="txt">应用路由层</text>
  <text x="895" y="168" class="small">读写分离策略</text>

  <rect x="1040" y="120" width="145" height="66" rx="12" fill="#ffffff" stroke="#64748b" class="node"/>
  <text x="1112" y="147" class="txt">用户查询</text>
  <text x="1112" y="168" class="small">订单详情 / 列表</text>

  <path d="M205 153 L270 153" class="line"/>
  <path d="M430 153 L520 103" class="line"/>
  <path d="M430 153 L520 223" class="line"/>
  <path d="M665 103 L820 153" class="line"/>
  <path d="M665 223 L820 153" class="line"/>
  <path d="M970 153 L1040 153" class="line"/>
  <path d="M270 190 C270 280, 895 280, 895 186" class="dash"/>
  <text x="650" y="315" class="small">写后 3~10 秒内的订单详情，通常仍读主库，避免读己之写问题</text>

  <rect x="80" y="390" width="1080" height="118" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="110" y="424" class="note">这个案例里最常见的故障不是主库写坏了，而是“写成功了，用户立刻去查却从从库读到了旧数据”。</text>
  <text x="110" y="452" class="note">所以读写分离一定要分级：支付回调、订单创建、刚支付后的详情页读主库；订单列表、物流轨迹、客服后台的可延迟查询走从库。</text>
  <text x="110" y="480" class="note">复制方式可以是异步复制或半同步复制，生产还要加复制延迟监控、GTID 追平判断和故障时自动回切主库的策略。</text>
</svg>
